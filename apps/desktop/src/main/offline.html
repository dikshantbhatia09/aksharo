<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aksharo — Offline</title>
    <meta http-equiv="Content-Security-Policy" content="__CSP__" />
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0c0f;
        color: #f5f5f7;
      }
      main {
        text-align: center;
        max-width: 28rem;
        padding: 2rem;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.4rem;
        border-radius: 0.5rem;
        border: 1px solid #444;
        background: #1c1d21;
        color: inherit;
        cursor: pointer;
        font-size: 0.95rem;
      }
      button:hover {
        background: #2a2b30;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach Aksharo</h1>
      <p>The app couldn't load — check your internet connection and try again.</p>
      <button id="retry">Retry</button>
    </main>
    <script src="./offline.js"></script>
  </body>
</html>
