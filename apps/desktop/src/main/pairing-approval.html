<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Approve pairing — Aksharo</title>
    <meta http-equiv="Content-Security-Policy" content="__CSP__" />
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0c0f;
        color: #f5f5f7;
      }
      main {
        text-align: center;
        max-width: 22rem;
        padding: 1.5rem;
      }
      .code {
        font-size: 2rem;
        letter-spacing: 0.3rem;
        font-weight: 600;
        margin: 1rem 0;
      }
      .client {
        color: #b7b9c2;
        font-size: 0.95rem;
      }
      .countdown {
        margin-top: 0.75rem;
        font-size: 0.8rem;
        color: #8a8d99;
      }
      .actions {
        margin-top: 1.5rem;
        display: flex;
        gap: 0.75rem;
        justify-content: center;
      }
      button {
        padding: 0.6rem 1.4rem;
        border-radius: 0.5rem;
        border: 1px solid #444;
        background: #1c1d21;
        color: inherit;
        cursor: pointer;
        font-size: 0.95rem;
      }
      button:hover {
        background: #2a2b30;
      }
      #approve {
        background: #1f6feb;
        border-color: #1f6feb;
      }
      #approve:hover {
        background: #2f7ffb;
      }
    </style>
  </head>
  <body data-deadline="__DEADLINE__">
    <main>
      <h1>Approve pairing?</h1>
      <p class="client">__CLIENT_KIND__ · __CLIENT_NAME__</p>
      <p class="code">__CODE__</p>
      <p>Compare this code with the one shown on the other device.</p>
      <div class="actions">
        <button id="deny">Deny</button>
        <button id="approve">Approve</button>
      </div>
      <p class="countdown">Auto-deny in <span id="countdown">60</span>s</p>
    </main>
    <script src="./pairing-approval.js"></script>
  </body>
</html>
