# Routing table v2 — the table in `03-architecture/09-ai-pipeline.md` §1.3 and
# decision D12, as data.
#
# The worker only READS this file. Weights become admin-editable later, and
# `09 §8` is explicit that they are NOT frozen until the Hinglish eval set exists
# (A00-05): no vendor publishes a code-switch WER, so the numbers below are the
# research ordering, not a measurement.
#
# lanes are matched in order; the first whose `languages` contains the detected
# tag (or its base subtag) wins, and `default` catches everything else.
#
# `local-whisper`'s `model` field here is DOCUMENTATION, not a per-lane
# selector: the adapter has one configured weight for the whole deployment
# (`WORKER_AI_WHISPER_MODEL`/`Settings.whisper_model`), the same way every
# lane below already shared one `small`-on-CPU instance before this weight
# existed. Keep this field naming whatever that setting actually points at —
# see `docs/models/LOCAL-MODELS.md` for the deployed weight and why.
#
# candidate fields
#   provider   registry name (worker_ai/providers/registry.py)
#   model      vendor model id, echoed into `usage.model`
#   mode       vendor-specific mode; `codemix` is what makes Saaras a code-mix lane
#   api        `rest` or `batch` — Sarvam is batch-only (30 s REST cap, `09 §1`)
#   alignment  `required` when the vendor returns no word timings, else `optional`
#   weight     relative share once shadow routing starts; ties break on order
#   costPerMinuteInr  list price, for the estimate written into `usage.costMinor`

version: 2
default: global

lanes:
  - id: hinglish
    label: Hinglish / code-mixed hi-en
    languages: ["hi-en", "hinglish", "hi_en", "en-hi"]
    codeMix: true
    candidates:
      - provider: sarvam
        model: saaras-v4
        mode: codemix
        api: batch
        alignment: required
        weight: 100
        costPerMinuteInr: 0.53
      - provider: elevenlabs
        model: scribe-v2
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.35
      - provider: serverless-whisper
        model: large-v3-turbo
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.11
      - provider: local-whisper
        model: whisper-hindi2hinglish-apex
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.0

  - id: hindi
    label: Hindi (pure)
    languages: ["hi", "hi-IN"]
    candidates:
      - provider: elevenlabs
        model: scribe-v2
        alignment: optional
        weight: 100
        costPerMinuteInr: 0.35
      - provider: sarvam
        model: saaras-v4
        api: batch
        alignment: required
        weight: 0
        costPerMinuteInr: 0.53
      - provider: serverless-whisper
        model: large-v3-turbo
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.11
      - provider: local-whisper
        model: whisper-hindi2hinglish-apex
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.0

  - id: indian-english
    label: Indian English
    languages: ["en-IN"]
    candidates:
      - provider: elevenlabs
        model: scribe-v2
        alignment: optional
        weight: 60
        costPerMinuteInr: 0.35
      - provider: assemblyai
        model: universal-2
        alignment: optional
        weight: 40
        costPerMinuteInr: 0.24
      - provider: serverless-whisper
        model: large-v3-turbo
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.11
      # Same deployed weight as the hinglish/hindi lanes above (one setting,
      # not a per-lane choice — see the note at the top of this file). It is
      # a Hindi/Hinglish fine-tune of large-v3; its accuracy on pure English
      # audio is unmeasured here. Unconfigured vendors above are the reason
      # this lane reaches local-whisper at all today (`09 §1`) — the moment
      # any one of them gets a key, English traffic stops depending on this.
      - provider: local-whisper
        model: whisper-hindi2hinglish-apex
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.0

  - id: indic-scribe
    label: Indic languages Scribe covers
    languages: ["ta", "te", "kn", "ml", "bn", "mr", "gu", "or", "ne", "as", "pa"]
    candidates:
      - provider: elevenlabs
        model: scribe-v2
        alignment: optional
        weight: 100
        costPerMinuteInr: 0.35
      - provider: sarvam
        model: saaras-v4
        api: batch
        alignment: required
        weight: 0
        costPerMinuteInr: 0.53

  - id: indic-sarvam
    label: Indic languages Scribe does not cover
    languages: ["ur", "sd", "kok", "ks", "sa", "sat", "mni", "brx", "mai", "doi"]
    candidates:
      - provider: sarvam
        model: saaras-v4
        api: batch
        alignment: required
        weight: 100
        costPerMinuteInr: 0.53
      - provider: elevenlabs
        model: scribe-v2
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.35

  - id: global
    label: Global languages
    languages: []
    candidates:
      - provider: serverless-whisper
        model: large-v3-turbo
        alignment: optional
        weight: 100
        costPerMinuteInr: 0.11
      - provider: assemblyai
        model: universal-2
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.24
      # Same tradeoff noted on the indian-english lane above: a Hindi/Hinglish
      # fine-tune, not stock large-v3, serving as the global fallback too.
      - provider: local-whisper
        model: whisper-hindi2hinglish-apex
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.0
