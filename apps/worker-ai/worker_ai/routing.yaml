# Routing table v2 — the table in `03-architecture/09-ai-pipeline.md` §1.3 and
# decision D12, as data.
#
# The worker only READS this file. Weights become admin-editable later, and
# `09 §8` is explicit that they are NOT frozen until the Hinglish eval set exists
# (A00-05): no vendor publishes a code-switch WER, so the numbers below are the
# research ordering, not a measurement.
#
# lanes are matched in order; the first whose `languages` contains the detected
# tag (or its base subtag) wins, and `default` catches everything else.
#
# `local-whisper`'s `model` field is HONOURED: it picks which of the adapter's
# two sets of weights a lane runs (`routing.MODEL_SELECTING_PROVIDERS`; for
# every other provider `model` only names what the vendor runs).
#   large-v3-turbo               -> WORKER_AI_WHISPER_MODEL_EN, a general model
#   whisper-hindi2hinglish-apex  -> WORKER_AI_WHISPER_MODEL, the Hinglish fine-tune
# With WORKER_AI_WHISPER_MODEL_EN unset — or ignored at boot as unusable, or
# failing to load — both names run WORKER_AI_WHISPER_MODEL, which is how every
# lane behaved before this field was honoured; the job's
# `engineVersions.asrWeights` then names the fine-tune, and its language
# detection is not used for "auto". The lane picks, not the request's language,
# because an "auto" job's first chunk goes out with no language (it is the LID
# probe) and is kept when LID keeps the lane. `tests/test_whisper_models.py`
# fails on a local-whisper name outside these two. See
# `docs/models/LOCAL-MODELS.md` for the deployed weights.
#
# Deploy order: worker-ai with WORKER_AI_WHISPER_MODEL_EN set, checked on one
# job (worker-ai README, "Two Whisper models"), BEFORE any API that sends
# "auto". Undo: blank the variable, restart worker-ai.
#
# candidate fields
#   provider   registry name (worker_ai/providers/registry.py)
#   model      vendor model id, echoed into `usage.model`
#   mode       vendor-specific mode; `codemix` is what makes Saaras a code-mix lane
#   api        `rest` or `batch` — Sarvam is batch-only (30 s REST cap, `09 §1`)
#   alignment  `required` when the vendor returns no word timings, else `optional`
#   weight     relative share once shadow routing starts; ties break on order
#   costPerMinuteInr  list price, for the estimate written into `usage.costMinor`

version: 2
default: global

lanes:
  - id: hinglish
    label: Hinglish / code-mixed hi-en
    languages: ["hi-en", "hinglish", "hi_en", "en-hi"]
    codeMix: true
    candidates:
      - provider: sarvam
        model: saaras-v4
        mode: codemix
        api: batch
        alignment: required
        weight: 100
        costPerMinuteInr: 0.53
      - provider: elevenlabs
        model: scribe-v2
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.35
      - provider: serverless-whisper
        model: large-v3-turbo
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.11
      - provider: local-whisper
        model: whisper-hindi2hinglish-apex
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.0

  - id: hindi
    label: Hindi (pure)
    languages: ["hi", "hi-IN"]
    candidates:
      - provider: elevenlabs
        model: scribe-v2
        alignment: optional
        weight: 100
        costPerMinuteInr: 0.35
      - provider: sarvam
        model: saaras-v4
        api: batch
        alignment: required
        weight: 0
        costPerMinuteInr: 0.53
      - provider: serverless-whisper
        model: large-v3-turbo
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.11
      - provider: local-whisper
        model: whisper-hindi2hinglish-apex
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.0

  - id: indian-english
    label: Indian English
    languages: ["en-IN"]
    candidates:
      - provider: elevenlabs
        model: scribe-v2
        alignment: optional
        weight: 60
        costPerMinuteInr: 0.35
      - provider: assemblyai
        model: universal-2
        alignment: optional
        weight: 40
        costPerMinuteInr: 0.24
      - provider: serverless-whisper
        model: large-v3-turbo
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.11
      # The general model, not the Hinglish fine-tune: on English speech the
      # fine-tune wrote "1 more" and "built built built" into real titles
      # (2026-09-27). Unconfigured vendors above are why this lane reaches
      # local-whisper at all today (`09 §1`).
      - provider: local-whisper
        model: large-v3-turbo
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.0

  - id: indic-scribe
    label: Indic languages Scribe covers
    languages: ["ta", "te", "kn", "ml", "bn", "mr", "gu", "or", "ne", "as", "pa"]
    candidates:
      - provider: elevenlabs
        model: scribe-v2
        alignment: optional
        weight: 100
        costPerMinuteInr: 0.35
      - provider: sarvam
        model: saaras-v4
        api: batch
        alignment: required
        weight: 0
        costPerMinuteInr: 0.53

  - id: indic-sarvam
    label: Indic languages Scribe does not cover
    languages: ["ur", "sd", "kok", "ks", "sa", "sat", "mni", "brx", "mai", "doi"]
    candidates:
      - provider: sarvam
        model: saaras-v4
        api: batch
        alignment: required
        weight: 100
        costPerMinuteInr: 0.53
      - provider: elevenlabs
        model: scribe-v2
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.35

  - id: global
    label: Global languages
    languages: []
    candidates:
      - provider: serverless-whisper
        model: large-v3-turbo
        alignment: optional
        weight: 100
        costPerMinuteInr: 0.11
      - provider: assemblyai
        model: universal-2
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.24
      # The general model, for three reasons. `en` lands in this lane. So does
      # every job whose language is "auto": its first chunk is transcribed
      # here with no language and that answer is LID's acoustic signal — and
      # the fine-tune reports every language as English (every local-whisper
      # probe since it went live on 2026-09-12 said `en` at 1.0, Hinglish audio
      # included), so its answer is never used as that signal (the pipeline
      # checks which weights ran). And the global languages are not Hindi; a
      # model tuned to write Hindi speech as Roman Hinglish is the wrong one
      # for them.
      - provider: local-whisper
        model: large-v3-turbo
        alignment: optional
        weight: 0
        costPerMinuteInr: 0.0
