[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "montaj-worker-ai"
version = "0.1.0"
description = "Python 3.12 BullMQ worker: ASR providers, VAD, alignment registry, diarisation, passes, LLM."
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
dependencies = [
  # Official BullMQ Python worker, pinned per docs/CONTRACTS.md section 3.
  # Unsupported and therefore unused: flow producers, repeatable jobs,
  # sandboxed processors.
  "bullmq==3.2.1",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "python-dotenv==1.2.3",
  # Signed callbacks (CONTRACTS section 3) and the serverless-GPU adapter.
  "httpx2==2.12.0",
  # Derived-media reads from R2/MinIO (CONTRACTS section 6).
  "boto3==1.43.86",
  # routing.yaml — the v2 routing table as data.
  "PyYAML==6.0.3",
  # VAD framing maths and the ONNX Silero session.
  "numpy==2.5.2",
  "onnxruntime==1.29.0",
  # Eval harness: WER/CER.
  "jiwer==4.0.0",
]

[project.optional-dependencies]
# faster-whisper drags in ctranslate2 and a model download, so it is opt-in: the
# CPU Docker image installs it, `LocalWhisperProvider` imports it lazily, and the
# `slow` test skips when it is absent.
local-asr = ["faster-whisper==1.2.1"]
# LAION CLAP (D04a `audio_embed`): heavy (torch + transformers), so it is opt-in
# the same way local-asr is — `ClapEmbedder` imports it lazily and the slow test
# skips when CLAP_MODEL_PATH is unset (H-22).
local-clap = ["laion-clap==1.1.6"]
# YuNet face detector (`passes/tracking.py`): OpenCV's ONNX-backed FaceDetectorYN.
# Headless build — this is a worker process, never a display.
local-vision = ["opencv-python-headless==4.10.0.84"]
dev = [
  "ruff==0.16.5",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.167.1",
  "pip-tools==7.6.1",
  "types-PyYAML==6.0.12.20260815",
  # B10b: the `ai.clean` RSS bound on a 60-minute synthetic file
  # (`tests/test_clean_dsp.py`'s `slow`-marked test).
  "psutil==7.2.2",
  "types-psutil==7.2.2.20260827",
]

[project.scripts]
montaj-worker-ai = "worker_ai.__main__:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["worker_ai*"]

[tool.setuptools.package-data]
# The routing table and the eval fixtures are data the worker reads at runtime,
# so a container built from the wheel must carry them.
worker_ai = [
  "routing.yaml",
  "py.typed",
  "fixtures/**/*.yaml",
  "fixtures/**/*.json",
  # The CC0 speech clip and its licence: the `slow` tests and the vendor-replay
  # eval set both read them, and a wheel without the licence would ship media
  # with no provenance.
  "fixtures/**/*.wav",
  "fixtures/**/LICENSE",
  "fixtures/**/*.md",
]

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort (import order, matching the TS convention)
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "RUF",  # ruff-specific
  "ANN",  # flake8-annotations (every signature is typed)
  "ASYNC",
  "S",    # bandit: no secrets, no shell=True, no assert in prod code
]
ignore = [
  "ANN401", # `Any` is occasionally the honest type at a provider boundary
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert and may use hard-coded fake credentials.
"tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["worker_ai"]

# ---------------------------------------------------------------------------
# mypy — strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
exclude = ["^\\.venv/", "^build/", "^dist/"]
mypy_path = "."

[[tool.mypy.overrides]]
# Packages that ship no type information. Nothing from any of them is ever named
# in a signature, so `disallow_any_unimported` still holds: each is wrapped by a
# Protocol or a small typed adapter in this package.
module = [
  "bullmq.*",
  "boto3.*",
  "botocore.*",
  "onnxruntime.*",
  "jiwer.*",
  "faster_whisper.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=worker_ai --cov-branch --cov-report=term-missing --cov-fail-under=75"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
  "slow: needs a real model download or GPU; runs only with RUN_SLOW=1",
  "integration: needs the compose stack (Redis) and a running API; RUN_INTEGRATION=1",
  "vendor: calls a real vendor and spends real money; RUN_VENDOR_SMOKE=1 (A00-06)",
]

# ---------------------------------------------------------------------------
# coverage — CONTRACTS section 9 gate for apps/worker-ai is 75 lines / 70 branches
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["worker_ai"]
omit = [
  # Process wiring: exercised by the integration run, not by unit tests.
  "worker_ai/__main__.py",
  # A fixture generator, not shipped code: it runs once to produce clip.wav and
  # is committed so the file can be reproduced rather than trusted.
  "worker_ai/fixtures/speech-5s/make_clip.py",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  '\.\.\.',
]
