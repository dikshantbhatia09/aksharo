# =============================================================================
# montaj chart — defaults.
#
# These defaults are the shape of the deployment, not a deployable environment:
# values-staging.yaml and values-prod.yaml supply hostnames, registry, sizes and
# the SSM path. Never put a secret in any values file — every credential in
# CONTRACTS section 1 arrives through external-secrets from SSM Parameter Store
# (THREAT-MODEL T21).
# =============================================================================

nameOverride: ""
fullnameOverride: ""

# Environment slug. Appears in labels and in the SSM parameter path.
environment: staging

image:
  # Container registry holding every montaj image. Set per environment.
  registry: ""
  # Empty tag falls back to Chart.appVersion, which the deploy workflow
  # overrides with the release SHA.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Labels and annotations added to every object in the chart.
commonLabels: {}
commonAnnotations: {}

# -----------------------------------------------------------------------------
# Secrets: SSM Parameter Store -> Kubernetes Secret, via external-secrets.
# -----------------------------------------------------------------------------
externalSecrets:
  enabled: true

  # external-secrets promoted these to v1 in 0.15. Override if the cluster still
  # runs an older controller.
  apiVersion: external-secrets.io/v1

  # Create a namespaced SecretStore pointing at SSM in this account and region.
  # Set false when a cluster-wide ClusterSecretStore already exists.
  createStore: true
  storeKind: SecretStore
  storeName: montaj-ssm

  region: ap-south-1

  # Service account external-secrets runs as, annotated with the IRSA role from
  # `terraform output external_secrets_role_arn`.
  serviceAccount:
    name: external-secrets
    namespace: external-secrets

  # SSM path prefix: `terraform output ssm_parameter_path`.
  parameterPath: /montaj/staging

  # Name PREFIX for the Kubernetes Secrets the ExternalSecrets materialise. Each
  # component gets its own, `<secretName>-<component>`.
  secretName: montaj-env

  refreshInterval: 1h

  # -------------------------------------------------------------------------
  # Per-component secret scope (launch-readiness P0-09).
  #
  # This used to be ONE ExternalSecret carrying the entire CONTRACTS section 1
  # contract, mounted by every component with `envFrom`. A compromised web pod
  # — the one process that parses untrusted input from the open internet — was
  # therefore handed the database URL, the JWT signing key, the Razorpay live
  # keys, the Google OAuth client secret, the mail credentials, every ASR and
  # LLM provider key, the worker callback secret and both object-store
  # credentials. One low-privilege RCE was a full-platform secret compromise.
  #
  # `shared` is the boot contract: `loadEnv()` in @montaj/config refuses to
  # start without these, so every Node service gets them. `components` adds only
  # what that component actually uses.
  #
  # The residual this used to carry is CLOSED. `shared` was forced to include
  # DATABASE_URL and both JWT keys because `loadEnv()` had a single required set
  # for every service, so worker-media and render refused to boot without
  # credentials they never read. `loadServiceEnv()` now validates only what a
  # given service needs (packages/config/src/env.ts), and those three moved out
  # of `shared` into the api entry below. A render pod no longer holds the
  # database URL or the token-signing key.
  #
  shared:
    # What EVERY service needs to boot: the queue, both object stores, the
    # callback secret and the two origins. Nothing here is a credential that
    # grants access to customer data on its own.
    - REDIS_URL
    - S3_ENDPOINT
    - S3_REGION
    - S3_BUCKET_RAW
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    - R2_ENDPOINT
    - R2_BUCKET_DERIVED
    - R2_ACCESS_KEY
    - R2_SECRET_KEY
    - INTERNAL_CALLBACK_SECRET
    - WEB_ORIGIN
    - API_ORIGIN
    # Operational, and carries no authority over customer data.
    - FEATURE_FLAGS_JSON
    - SENTRY_DSN

  variables:
    # The API is the only component that talks to a payment provider, an
    # identity provider and a mail provider, so it is the only one holding
    # those credentials.
    api:
      # The database and the token-signing key reach the API and nothing else.
      - DATABASE_URL
      - JWT_PRIVATE_KEY
      - JWT_PUBLIC_KEY
      - INTERNAL_CALLBACK_SECRET_NEXT
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
      - RAZORPAY_KEY_ID
      - RAZORPAY_KEY_SECRET
      - RAZORPAY_WEBHOOK_SECRET
      - MAIL_PROVIDER
      - MAIL_FROM
      - SMTP_URL
      - MAIL_SNS_TOPIC_ARN
      - POSTHOG_KEY
      - S3_PUBLIC_ENDPOINT
      - R2_PUBLIC_ENDPOINT
      - LLM_PROVIDER
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - LLM_BASE_URL
      - LLM_MODEL

    # The web app is a Next server. It renders and proxies; it holds no
    # provider, payment or identity credential of its own. Its OAuth journey is
    # a redirect to the API, which is where the client secret lives.
    web:
      - POSTHOG_KEY
      - S3_PUBLIC_ENDPOINT
      - R2_PUBLIC_ENDPOINT

    # ffmpeg/ffprobe over object storage, reporting back over a signed callback.
    # No provider keys at all.
    worker-media:
      - INTERNAL_CALLBACK_SECRET_NEXT
      - S3_PUBLIC_ENDPOINT
      - R2_PUBLIC_ENDPOINT

    # The only component that may talk to an ASR, LLM or GPU provider.
    worker-ai:
      - INTERNAL_CALLBACK_SECRET_NEXT
      - SARVAM_API_KEY
      - ELEVENLABS_API_KEY
      - ASSEMBLYAI_API_KEY
      - LLM_PROVIDER
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - LLM_BASE_URL
      - LLM_MODEL
      - GPU_PROVIDER
      - GPU_PROVIDER_URL
      - GPU_PROVIDER_TOKEN

    # Skia + ffmpeg over object storage. Same shape as worker-media.
    render:
      - INTERNAL_CALLBACK_SECRET_NEXT
      - LICENSE_SIGNING_KID
      - S3_PUBLIC_ENDPOINT
      - R2_PUBLIC_ENDPOINT

    # Disabled components, kept so re-enabling one does not also have to
    # rediscover its secret scope.
    realtime:
      # Disabled, but it is the API image: re-enabling it means re-granting these.
      - DATABASE_URL
      - JWT_PRIVATE_KEY
      - JWT_PUBLIC_KEY
      - POSTHOG_KEY
    scheduler:
      - DATABASE_URL
      - JWT_PRIVATE_KEY
      - JWT_PUBLIC_KEY
      - MAIL_PROVIDER
      - MAIL_FROM
      - SMTP_URL
      - MAIL_SNS_TOPIC_ARN
      - RAZORPAY_KEY_ID
      - RAZORPAY_KEY_SECRET
      - RAZORPAY_WEBHOOK_SECRET

# -----------------------------------------------------------------------------
# Non-secret configuration, mounted as a ConfigMap alongside the secret.
# -----------------------------------------------------------------------------
config:
  NODE_ENV: production
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.observability.svc.cluster.local:4318
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "0.1"

# host:port of the Redis endpoint, for the KEDA scalers. KEDA reads it from the
# scale target's environment, and its redis scaler wants host:port rather than
# the rediss:// URL that REDIS_URL (CONTRACTS section 1) carries.
redis:
  address: ""
  enableTLS: true
  databaseIndex: 0

# -----------------------------------------------------------------------------
# Autoscaling on queue depth (KEDA).
# -----------------------------------------------------------------------------
keda:
  enabled: true
  apiVersion: keda.sh/v1alpha1

  # Where the backlog metric is read from.
  #
  # NOT the Redis-list scaler this chart used to use. Every job the API enqueues
  # carries a priority, and BullMQ keeps prioritised jobs in a sorted set rather
  # than in the `wait` list — so `LLEN <prefix>:<queue>:wait` was very nearly
  # always 0 while the real backlog grew (P0-04). The scaler now reads
  # `montaj_queue_depth{state=~"waiting|prioritized"}`, published by the API and
  # scraped from `GET /internal/metrics`. See templates/scaledobject.yaml.
  prometheus:
    serverAddress: http://prometheus-server.observability.svc.cluster.local
    # Set when Prometheus is behind auth; blank means an in-cluster scrape with
    # no credential, which is what the NetworkPolicy already scopes.
    authModes: ""
    authenticationRef: ""

  # Still used by the Redis key helper for tooling and runbooks; no longer the
  # scaling signal.
  queuePrefix: bull

  pollingInterval: 15
  cooldownPeriod: 180

# -----------------------------------------------------------------------------
# Ingress. TLS certificates come from cert-manager.
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

  tls:
    enabled: true

  hosts:
    web: app.aksharo.ai
    api: api.aksharo.ai

  # Extra annotations only on the API ingress: the realtime gateway needs long
  # read timeouts for WebSocket upgrades (CONTRACTS section 7).
  apiAnnotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# -----------------------------------------------------------------------------
# Network policy. Default deny, then named allowances.
#
# A NetworkPolicy selects by IP, never by hostname, so the provider allow-list
# below documents intent and drives the optional CiliumNetworkPolicy, which CAN
# match FQDNs. Without Cilium, worker egress to the internet is allowed on 443
# only when allowInternetHttps is true for that component, and the real
# enforcement point is the egress proxy named in the runbooks.
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true

  # CIDR of the VPC: RDS, ElastiCache and the S3 gateway endpoint all live here.
  # `terraform output vpc_cidr_block`.
  vpcCidr: 10.20.0.0/16

  # Namespace and selector for CoreDNS.
  dns:
    namespace: kube-system
    selectorLabel: k8s-app
    selectorValue: kube-dns

  # Namespace the ingress controller runs in.
  ingressControllerNamespace: ingress-nginx

  # Namespace the metrics/telemetry collector runs in.
  observabilityNamespace: observability

  # FQDN egress enforcement lifecycle (X08, decision D73). Requires Cilium as
  # the CNI; the AWS VPC CNI cannot express this, so anything but "off" is
  # inert on a stock EKS cluster (the CiliumNetworkPolicy CRD is simply absent,
  # and `helm template` renders nothing for it — see templates/networkpolicy-
  # fqdn.yaml). Three values, meant to be moved through in order on a staged
  # rollout (docs/runbooks/egress-policy.md):
  #
  #   off      No CiliumNetworkPolicy is rendered. The coarse rule in
  #            templates/networkpolicy.yaml is the only egress control a
  #            provider-egress component gets: 443 to anywhere off the private
  #            ranges. Safe on any CNI; the chart's default.
  #   audit    The CiliumNetworkPolicy is rendered and applied with Cilium's
  #            per-policy audit annotation (`policy.cilium.io/audit-mode:
  #            "true"`): denials are logged (`cilium monitor`, Hubble), never
  #            dropped. The coarse rule stays in force underneath it, so
  #            traffic is not interrupted while the allow-list is verified
  #            against real traffic.
  #   enforce  The CiliumNetworkPolicy drops anything outside
  #            providerAllowlist / providerAllowlistSuffixes. The coarse rule
  #            is no longer rendered for a provider-egress component: Cilium is
  #            the sole enforcement point, exactly as narrow as the allow-list.
  #
  # `off` and `enforce` are D73's two named states (chart ships the enforce
  # variant validated, off by default); `audit` is the staged-rollout step X08
  # adds between them.
  fqdn:
    mode: off # off | audit | enforce

  # The provider allow-list. Every hostname a worker is permitted to reach, with
  # the reason, so a reviewer can tell an ASR vendor from an exfiltration path.
  providerAllowlist:
    - host: api.elevenlabs.io
      reason: ElevenLabs Scribe v2 ASR (CONTRACTS ELEVENLABS_API_KEY)
    - host: api.sarvam.ai
      reason: Sarvam Saaras v4 ASR (CONTRACTS SARVAM_API_KEY)
    - host: api.assemblyai.com
      reason: AssemblyAI Universal-2 ASR (CONTRACTS ASSEMBLYAI_API_KEY)
    - host: api.anthropic.com
      reason: LLM extras when LLM_PROVIDER=anthropic
    - host: api.openai.com
      reason: LLM extras when LLM_PROVIDER=openai
    - host: api.runpod.ai
      reason: Serverless GPU control plane (decision D15)
    - host: api.runpod.io
      reason: Serverless GPU job submission
  # Prefixes matched as suffixes rather than exact hosts.
  providerAllowlistSuffixes:
    - host: ".r2.cloudflarestorage.com"
      reason: Derived object storage (R2_ENDPOINT)
    - host: ".ingest.sentry.io"
      reason: Error reporting (SENTRY_DSN)

# -----------------------------------------------------------------------------
# Namespace and Pod Security Admission.
#
# The pod templates below already meet the `restricted` standard; PSA is what
# makes that enforced rather than merely true today. `create: false` by default
# because `helm --create-namespace` already makes the namespace and taking
# ownership of an existing one would let an uninstall delete it — see
# templates/namespace.yaml for how to apply the labels without that.
# -----------------------------------------------------------------------------
namespace:
  create: false
  podSecurityLevel: restricted
  # Pin the standard's version so a cluster upgrade cannot silently tighten (or
  # loosen) what is admitted. `latest` would make an upgrade a surprise.
  podSecurityVersion: v1.33

# -----------------------------------------------------------------------------
# Pod-level defaults applied to every component.
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

priorityClassName: ""
nodeSelector: {}
tolerations: []
topologySpreadDefault: true
# `DoNotSchedule` rather than `ScheduleAnyway` for zone spreading, plus a second
# hostname constraint. Off by default so a single-node dev cluster can still
# schedule; values-prod.yaml turns it on. See templates/deployment.yaml.
topologySpreadStrict: false

terminationGracePeriodSeconds: 60

# -----------------------------------------------------------------------------
# Components.
#
# kind:
#   web      HTTP service, ingress-facing, HPA on CPU
#   worker   queue consumer, no service, KEDA on queue depth
#   cron     singleton, no autoscaling
# -----------------------------------------------------------------------------
components:
  api:
    enabled: true
    kind: web
    repository: montaj/api
    replicas: 2
    port: 3001
    ingress:
      enabled: true
      host: api
      path: /
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { memory: 1Gi }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 12
      targetCPUUtilizationPercentage: 65
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: true
      minAvailable: 1
    probes:
      # Liveness is /health: dependency-free on purpose, so a slow database
      # restarts nothing.
      liveness:
        httpGet: { path: /health, port: http }
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
      # Readiness is /health/ready, which actually checks PostgreSQL, Redis and
      # both object stores. It pointed at /health until the launch-readiness
      # audit, so a pod with a dead database, no Redis and invalid storage
      # credentials was put straight into the load balancer and 500ed every
      # request it was sent (P0-03). Longer timeout than liveness because this
      # one makes real calls.
      readiness:
        httpGet: { path: /health/ready, port: http }
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 3
      # Startup stays on /health: the question here is "has the process finished
      # booting", and a dependency that is slow to come up should delay traffic
      # (readiness) rather than kill the container.
      startup:
        httpGet: { path: /health, port: http }
        periodSeconds: 5
        failureThreshold: 30
    network:
      # The API is the only component that talks to a payment provider and an
      # identity provider, so it is the only one with broad HTTPS egress.
      allowInternetHttps: true
      allowIngressFromIngressController: true
      allowIngressFromCluster: true

  web:
    enabled: true
    kind: web
    repository: montaj/web
    replicas: 2
    port: 3000
    ingress:
      enabled: true
      host: web
      path: /
    resources:
      requests: { cpu: 150m, memory: 384Mi }
      limits: { memory: 768Mi }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    probes:
      liveness:
        httpGet: { path: /health, port: http }
        initialDelaySeconds: 15
        periodSeconds: 20
      readiness:
        httpGet: { path: /health, port: http }
        initialDelaySeconds: 5
        periodSeconds: 5
    network:
      # Server-side rendering calls the API over the cluster network only.
      allowInternetHttps: false
      allowIngressFromIngressController: true
      allowIngressFromCluster: false

  # ---------------------------------------------------------------------------
  # realtime — DISABLED. It was never a separate process.
  #
  # This block declared `--role=realtime` on port 3002 with its own Service and
  # a /ws ingress path. None of it was true (launch-readiness P0-03):
  #
  #   * `apps/api/src/main.ts` never parsed `--role`, so the pod booted the
  #     complete AppModule — the same REST surface, the same scheduled modules,
  #     the whole secret set — and listened on API_PORT, not 3002. The Service
  #     therefore pointed at a port nothing was bound to.
  #   * The WebSocket path is `/realtime`
  #     (`apps/api/src/realtime/realtime.protocol.ts`), not `/ws`. The route only
  #     worked at all because the API's own `/` rule caught it.
  #   * So the "isolation" — separate scaling, separate blast radius — did not
  #     exist, while the deployment described it as if it did.
  #
  # The API image now REFUSES to start with an unimplemented `--role`, so this
  # cannot quietly come back. Until real per-role module graphs exist, the API
  # serves `/realtime` itself on its own port: `ingress.apiAnnotations` already
  # carries the long proxy read/send timeouts a WebSocket upgrade needs.
  #
  # To re-enable: implement the role in `main.ts`, set `path: /realtime`, and
  # point `port` at whatever that role actually binds.
  realtime:
    enabled: false
    kind: web
    repository: montaj/api
    command: ["node", "dist/main.js", "--role=realtime"]
    replicas: 2
    port: 3002
    ingress:
      enabled: true
      host: api
      path: /realtime
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 60
    pdb:
      enabled: true
      minAvailable: 1
    probes:
      liveness:
        httpGet: { path: /health, port: http }
        initialDelaySeconds: 15
        periodSeconds: 20
      readiness:
        httpGet: { path: /health/ready, port: http }
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 5
    network:
      allowInternetHttps: false
      allowIngressFromIngressController: true
      allowIngressFromCluster: true

  worker-media:
    enabled: true
    kind: worker
    repository: montaj/worker-media
    replicas: 1
    # ffmpeg is CPU-bound and happily uses every core it is given.
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
    # Scratch space for proxies and extracted audio. Sized for a 6-hour source.
    scratchVolume:
      enabled: true
      sizeLimit: 40Gi
      mountPath: /scratch
    keda:
      enabled: true
      minReplicaCount: 0
      maxReplicaCount: 12
      # `listLength` is the target runnable backlog PER REPLICA: KEDA runs
      # ceil(backlog / listLength) pods. The numbers are unchanged from the
      # Redis-list scaler because the meaning is the same; only the source of
      # "backlog" was wrong.
      queues:
        - name: media.probe
          listLength: 4
        - name: media.proxy
          listLength: 2
    pdb:
      enabled: true
      maxUnavailable: 1
    network:
      allowInternetHttps: false
      allowIngressFromIngressController: false
      allowIngressFromCluster: false

  worker-ai:
    enabled: true
    kind: worker
    repository: montaj/worker-ai
    replicas: 1
    # The CPU variant: VAD, chunking, routing and the vendor ASR calls. Whisper
    # inference itself runs on the serverless GPU provider (decision D15).
    #
    # 8091 and not 8000: that is what `apps/worker-ai/Dockerfile` exposes and
    # what the control server binds. The chart declared 8000, so the Service
    # pointed at a closed port and both probes failed forever — the Deployment
    # would never have become Available (P0-03).
    port: 8091
    resources:
      requests: { cpu: 500m, memory: 1.5Gi }
      limits: { cpu: "2", memory: 3Gi }
    scratchVolume:
      enabled: true
      sizeLimit: 20Gi
      mountPath: /scratch
    probes:
      liveness:
        httpGet: { path: /health, port: http }
        initialDelaySeconds: 20
        periodSeconds: 30
      readiness:
        httpGet: { path: /health, port: http }
        initialDelaySeconds: 10
        periodSeconds: 10
    keda:
      enabled: true
      minReplicaCount: 0
      maxReplicaCount: 20
      queues:
        - name: ai.vad
          listLength: 8
        - name: ai.transcribe
          listLength: 2
        - name: ai.align
          listLength: 4
        - name: ai.diarise
          listLength: 4
        - name: ai.translate
          listLength: 4
        - name: ai.transliterate
          listLength: 8
        - name: ai.clean
          listLength: 4
        - name: ai.pass
          listLength: 4
        - name: ai.llm
          listLength: 4
    pdb:
      enabled: true
      maxUnavailable: 1
    network:
      # Egress to the ASR, LLM and GPU providers only. The allow-list is
      # networkPolicy.providerAllowlist; without Cilium it is enforced by the
      # egress proxy, not by this policy.
      allowInternetHttps: false
      allowProviderEgress: true
      allowIngressFromIngressController: false
      allowIngressFromCluster: false

  render:
    enabled: true
    kind: worker
    repository: montaj/render
    replicas: 0
    # Skia draw commands plus ffmpeg overlay and x264: the most CPU-hungry
    # workload in the cluster (05 section 5.2).
    resources:
      requests: { cpu: "2", memory: 4Gi }
      limits: { cpu: "4", memory: 8Gi }
    scratchVolume:
      enabled: true
      sizeLimit: 80Gi
      mountPath: /scratch
    keda:
      enabled: true
      minReplicaCount: 0
      maxReplicaCount: 16
      queues:
        - name: render.video
          listLength: 1
        - name: render.subtitle
          listLength: 8
    pdb:
      enabled: true
      maxUnavailable: 1
    # A render in flight is expensive to abandon: let it finish.
    terminationGracePeriodSeconds: 600
    network:
      allowInternetHttps: false
      allowIngressFromIngressController: false
      allowIngressFromCluster: false

  # ---------------------------------------------------------------------------
  # scheduler — DISABLED. The API replicas already schedule, safely.
  #
  # Same fiction as `realtime` above: `--role=scheduler` was never parsed, so
  # this pod ran the entire API — every route, every secret — and called itself
  # a cron singleton (P0-03).
  #
  # Nothing is lost by removing it. Scheduled work does not run on a timer in
  # each process: `common/scheduler/scheduled-tasks.service.ts` registers BullMQ
  # repeatable jobs, so a tick becomes exactly one Redis job and exactly one
  # worker takes it, however many replicas exist. "Only one scheduler execution
  # per task window" is a property of the queue, not of the replica count — and
  # a separate Deployment adds a second full API's worth of attack surface for
  # no scheduling guarantee it did not already have.
  #
  # `MONTAJ_SCHEDULER_DISABLED=1` on a component opts it out entirely.
  # To re-enable as a real singleton: implement the role in `main.ts` so it
  # boots only `SchedulerTasksModule` and its dependencies, then set the API
  # components to `MONTAJ_SCHEDULER_DISABLED=1`.
  scheduler:
    enabled: false
    kind: cron
    repository: montaj/api
    command: ["node", "dist/main.js", "--role=scheduler"]
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }
    pdb:
      enabled: false
    network:
      allowInternetHttps: false
      allowIngressFromIngressController: false
      allowIngressFromCluster: false
