{{/*
One service account per component so an IRSA role can be scoped to exactly the
workload that needs it: only the api and the workers get S3 access, only the api
gets Secrets Manager, nothing else gets anything.
*/}}
{{- range $name, $spec := .Values.components }}
{{- if $spec.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "montaj.componentFullname" (dict "root" $ "component" $name) }}
  labels:
    {{- include "montaj.componentLabels" (dict "root" $ "component" $name) | nindent 4 }}
  {{- if or $spec.serviceAccountAnnotations $.Values.commonAnnotations }}
  annotations:
    {{- with $.Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $spec.serviceAccountAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
# No montaj workload calls the Kubernetes API, so the default token is not
# mounted: a compromised pod gets no cluster credential at all. IRSA still
# works — the EKS pod identity webhook injects its own projected token with the
# sts.amazonaws.com audience, which this setting does not affect.
automountServiceAccountToken: false
{{- end }}
{{- end }}
