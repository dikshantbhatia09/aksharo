{{/*
external-secrets: SSM Parameter Store -> one Kubernetes Secret.

Every variable is listed explicitly rather than pulled with a wildcard `find`,
so adding a variable to CONTRACTS section 1 without adding it here is a visible
diff and a CI failure (X05 acceptance criterion 2), and so a stray parameter
under the same path can never leak into the pod environment.

The controller assumes the IRSA role from `terraform output
external_secrets_role_arn`, which can read /montaj/<env>/* and decrypt with that
environment's KMS key. Nothing in this chart holds a credential.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.createStore }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: {{ .Values.externalSecrets.storeKind }}
metadata:
  name: {{ .Values.externalSecrets.storeName }}
  labels:
    {{- include "montaj.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.externalSecrets.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount.name }}
            namespace: {{ .Values.externalSecrets.serviceAccount.namespace }}
---
{{- end }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "montaj.envSecretName" . }}
  labels:
    {{- include "montaj.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: {{ .Values.externalSecrets.storeKind }}
  target:
    name: {{ include "montaj.envSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $var := .Values.externalSecrets.variables }}
    - secretKey: {{ $var }}
      remoteRef:
        key: {{ $.Values.externalSecrets.parameterPath }}/{{ $var }}
        decodingStrategy: None
    {{- end }}
{{- end }}
