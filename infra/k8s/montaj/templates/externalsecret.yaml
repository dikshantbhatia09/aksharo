{{/*
external-secrets: SSM Parameter Store -> one Kubernetes Secret PER COMPONENT.

It used to be one Secret carrying the whole CONTRACTS section 1 contract, which
every component mounted with `envFrom`. A compromised web pod — the process that
parses untrusted input straight off the internet — was therefore handed the
database URL, the JWT signing key, the Razorpay live keys, the Google OAuth
client secret, the mail credentials, every ASR and LLM provider key and both
object-store credentials. One low-privilege RCE was a full-platform secret
compromise (launch-readiness P0-09).

Each component now gets `externalSecrets.shared` (the variables `loadEnv()`
refuses to boot without) plus its own entry in `externalSecrets.variables`.
Every variable is still listed explicitly rather than pulled with a wildcard
`find`, so adding one to CONTRACTS section 1 without placing it here is a
visible diff and a CI failure (X05 acceptance criterion 2), and a stray
parameter under the same path can never leak into a pod's environment.

The controller assumes the IRSA role from `terraform output
external_secrets_role_arn`, which can read /montaj/<env>/* and decrypt with that
environment's KMS key. Nothing in this chart holds a credential.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.createStore }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: {{ .Values.externalSecrets.storeKind }}
metadata:
  name: {{ .Values.externalSecrets.storeName }}
  labels:
    {{- include "montaj.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.externalSecrets.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount.name }}
            namespace: {{ .Values.externalSecrets.serviceAccount.namespace }}
{{- end }}
{{- range $name, $spec := .Values.components }}
{{- if $spec.enabled }}
---
apiVersion: {{ $.Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "montaj.envSecretName" (dict "root" $ "component" $name) }}
  labels:
    {{- include "montaj.componentLabels" (dict "root" $ "component" $name) | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.storeName }}
    kind: {{ $.Values.externalSecrets.storeKind }}
  target:
    name: {{ include "montaj.envSecretName" (dict "root" $ "component" $name) }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $var := include "montaj.componentSecretVars" (dict "root" $ "component" $name) | fromYamlArray }}
    - secretKey: {{ $var }}
      remoteRef:
        key: {{ $.Values.externalSecrets.parameterPath }}/{{ $var }}
        decodingStrategy: None
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
