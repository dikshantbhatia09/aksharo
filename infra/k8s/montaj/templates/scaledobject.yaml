{{/*
KEDA ScaledObjects: workers and the render service scale on BullMQ queue depth.

BullMQ keeps waiting jobs in a Redis list at <prefix>:<queue>:wait, so the redis
scaler's listLength on that key is the true backlog. One trigger per queue the
component consumes; KEDA takes the maximum replica count the triggers ask for.

minReplicaCount 0 means an idle queue costs nothing. The first job after an idle
period pays a cold start, which is acceptable for a job that already takes tens
of seconds; the API's admission control (THREAT-MODEL T23) shows the user an ETA
either way.

The scaler reads the Redis address from KEDA_REDIS_ADDRESS in the scale target's
environment (set from the chart ConfigMap), because it wants host:port while
REDIS_URL carries the rediss:// form.
*/}}
{{- if .Values.keda.enabled }}
{{- range $name, $spec := .Values.components }}
{{- if and $spec.enabled $spec.keda }}
{{- if $spec.keda.enabled }}
---
apiVersion: {{ $.Values.keda.apiVersion }}
kind: ScaledObject
metadata:
  name: {{ include "montaj.componentFullname" (dict "root" $ "component" $name) }}
  labels:
    {{- include "montaj.componentLabels" (dict "root" $ "component" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "montaj.componentFullname" (dict "root" $ "component" $name) }}
  minReplicaCount: {{ $spec.keda.minReplicaCount }}
  maxReplicaCount: {{ $spec.keda.maxReplicaCount }}
  pollingInterval: {{ $.Values.keda.pollingInterval }}
  cooldownPeriod: {{ $spec.keda.cooldownPeriod | default $.Values.keda.cooldownPeriod }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
            - type: Pods
              value: 4
              periodSeconds: 30
          selectPolicy: Max
        scaleDown:
          # Long enough that a worker finishing a five-minute transcript is not
          # evicted the moment the queue empties.
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    {{- range $queue := $spec.keda.queues }}
    - type: redis
      metadata:
        addressFromEnv: KEDA_REDIS_ADDRESS
        listName: {{ include "montaj.queueWaitKey" (dict "root" $ "queue" $queue.name) | quote }}
        # One replica per this many waiting jobs.
        listLength: {{ $queue.listLength | quote }}
        # Below this the queue counts as idle and the component may scale to zero.
        activationListLength: {{ $queue.activationListLength | default 0 | quote }}
        enableTLS: {{ $.Values.redis.enableTLS | quote }}
        databaseIndex: {{ $.Values.redis.databaseIndex | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
