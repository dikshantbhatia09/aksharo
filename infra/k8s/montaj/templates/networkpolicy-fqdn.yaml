{{/*
CiliumNetworkPolicy: the provider allow-list enforced by hostname.

Only rendered when networkPolicy.fqdn.mode is "audit" or "enforce", which
requires Cilium as the CNI. On a stock EKS cluster running the AWS VPC CNI (or
with mode "off") this file produces nothing and the coarser rule in
networkpolicy.yaml applies instead.

This is where "workers egress-restricted except provider allow-lists" becomes
literally true: a worker may open 443 to api.elevenlabs.io and nothing else —
except in "audit" mode, where a denial is logged (Hubble / `cilium monitor`)
rather than dropped, for staged rollout (docs/runbooks/egress-policy.md).
*/}}
{{- if and .Values.networkPolicy.enabled (ne .Values.networkPolicy.fqdn.mode "off") }}
{{- range $name, $spec := .Values.components }}
{{- if $spec.enabled }}
{{- $net := $spec.network | default dict }}
{{- if $net.allowProviderEgress }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "montaj.componentFullname" (dict "root" $ "component" $name) }}-providers
  labels:
    {{- include "montaj.componentLabels" (dict "root" $ "component" $name) | nindent 4 }}
  annotations:
    montaj.ai/rationale: >-
      Hostname-scoped egress allow-list for {{ $name }}. Every entry is a
      provider named in CONTRACTS section 1 or in decision D15; anything else is
      {{ if eq $.Values.networkPolicy.fqdn.mode "audit" }}logged, not yet dropped (audit mode; docs/runbooks/egress-policy.md){{ else }}dropped, so a compromised worker cannot exfiltrate a transcript{{ end }}.
    {{- if eq $.Values.networkPolicy.fqdn.mode "audit" }}
    policy.cilium.io/audit-mode: "true"
    {{- end }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "montaj.componentSelectorLabels" (dict "root" $ "component" $name) | nindent 6 }}
  egress:
    # DNS must be answered by CoreDNS and inspected, or toFQDNs cannot learn the
    # addresses it is meant to allow.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ $.Values.networkPolicy.dns.namespace }}
            {{ $.Values.networkPolicy.dns.selectorLabel }}: {{ $.Values.networkPolicy.dns.selectorValue }}
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        {{- range $entry := $.Values.networkPolicy.providerAllowlist }}
        # {{ $entry.reason }}
        - matchName: {{ $entry.host | quote }}
        {{- end }}
        {{- range $entry := $.Values.networkPolicy.providerAllowlistSuffixes }}
        # {{ $entry.reason }}
        - matchPattern: {{ printf "*%s" $entry.host | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
{{- end }}
{{- end }}
{{- end }}
