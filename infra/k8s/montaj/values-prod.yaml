# =============================================================================
# Production overrides.
#
#   helm upgrade --install montaj infra/k8s/montaj \
#     -n montaj --create-namespace \
#     -f infra/k8s/montaj/values-prod.yaml
#
# Every value here comes from `terraform output` in infra/terraform/envs/prod.
# No secret ever appears in this file.
# =============================================================================

environment: prod

image:
  registry: ""
  pullPolicy: IfNotPresent

externalSecrets:
  enabled: true
  region: ap-south-1
  parameterPath: /montaj/prod
  refreshInterval: 15m

config:
  NODE_ENV: production
  LOG_LEVEL: info
  # 10 percent of traces is enough to see shape without paying for every span;
  # the job pipeline is traced end to end regardless through job events.
  OTEL_TRACES_SAMPLER_ARG: "0.1"

redis:
  address: ""
  enableTLS: true

networkPolicy:
  enabled: true
  # terraform output vpc_cidr_block
  vpcCidr: 10.30.0.0/16
  fqdn:
    # Flip to true once the cluster runs Cilium. Until then the provider
    # allow-list is documentation plus an egress proxy, not enforcement.
    enabled: false

ingress:
  enabled: true
  className: nginx
  hosts:
    web: app.aksharo.ai
    api: api.aksharo.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "40"

priorityClassName: ""

components:
  api:
    replicas: 3
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 2Gi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 24
      targetCPUUtilizationPercentage: 60
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: true
      minAvailable: 2

  web:
    replicas: 3
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits: { memory: 1Gi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 16
      targetCPUUtilizationPercentage: 65
    pdb:
      enabled: true
      minAvailable: 2

  realtime:
    replicas: 3
    resources:
      requests: { cpu: 300m, memory: 768Mi }
      limits: { memory: 1536Mi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      targetCPUUtilizationPercentage: 55
    pdb:
      enabled: true
      minAvailable: 2

  worker-media:
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "3", memory: 6Gi }
    scratchVolume:
      enabled: true
      sizeLimit: 60Gi
      mountPath: /scratch
    keda:
      enabled: true
      # One warm media worker: probe and proxy are on the critical path from
      # upload to editor, and a cold start there is visible to the user.
      minReplicaCount: 1
      maxReplicaCount: 24
    pdb:
      enabled: true
      maxUnavailable: 1

  worker-ai:
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "3", memory: 4Gi }
    keda:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 40
    pdb:
      enabled: true
      maxUnavailable: 1

  render:
    resources:
      requests: { cpu: "3", memory: 6Gi }
      limits: { cpu: "4", memory: 10Gi }
    scratchVolume:
      enabled: true
      sizeLimit: 120Gi
      mountPath: /scratch
    keda:
      enabled: true
      # Renders are bursty and expensive to keep warm; the export dialog already
      # shows an ETA, so zero is honest.
      minReplicaCount: 0
      maxReplicaCount: 24
    terminationGracePeriodSeconds: 900
    pdb:
      enabled: true
      maxUnavailable: 1

  scheduler:
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { memory: 768Mi }
