# =============================================================================
# Production overrides.
#
#   helm upgrade --install montaj infra/k8s/montaj \
#     -n montaj --create-namespace \
#     -f infra/k8s/montaj/values-prod.yaml
#
# Every value here comes from `terraform output` in infra/terraform/envs/prod.
# No secret ever appears in this file.
# =============================================================================

environment: prod

image:
  registry: ""
  pullPolicy: IfNotPresent

externalSecrets:
  enabled: true
  region: ap-south-1
  parameterPath: /montaj/prod
  refreshInterval: 15m

config:
  NODE_ENV: production
  LOG_LEVEL: info
  # 10 percent of traces is enough to see shape without paying for every span;
  # the job pipeline is traced end to end regardless through job events.
  OTEL_TRACES_SAMPLER_ARG: "0.1"

  # Connections each API process may open. 24 replicas x 10 = 240, plus ~25
  # reserved for migrations, monitoring and an operator, so this instance needs
  # `max_connections >= 300` — check it, do not assume; RDS derives the default
  # from instance memory. Worksheet: docs/runbooks/db-connection-budget.md.
  DATABASE_POOL_SIZE: "10"
  DATABASE_POOL_TIMEOUT_SEC: "10"

  # Trusted proxy hops in front of the API, counted from the right of
  # `X-Forwarded-For`: Cloudflare, then the ingress controller. Set this to
  # match the REAL chain — too high reads a client-supplied value as the client
  # address, too low gives everyone behind the edge one shared rate-limit
  # bucket. The ingress must strip any inbound X-Forwarded-For (P0-08).
  TRUST_PROXY: "2"

  # Interactive API docs stay off on the public origin: every route, every DTO
  # field, every error code, unauthenticated (P0-13).
  API_DOCS_ENABLED: "0"

redis:
  address: ""
  enableTLS: true

networkPolicy:
  enabled: true
  # terraform output vpc_cidr_block
  vpcCidr: 10.30.0.0/16
  fqdn:
    # Move to "audit" then "enforce" once the cluster runs Cilium
    # (docs/runbooks/egress-policy.md). Until then the provider allow-list is
    # documentation plus an egress proxy, not enforcement.
    mode: off

ingress:
  enabled: true
  className: nginx
  hosts:
    web: app.aksharo.ai
    api: api.aksharo.ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "40"

priorityClassName: ""

# Hard zone spreading for production.
#
# The chart default is `whenUnsatisfiable: ScheduleAnyway`, which lets every
# replica of a service land in one availability zone whenever capacity is tight
# — which is exactly when a zone failure is most likely to matter. A "3 replica"
# service all in one zone is a one-zone service with three times the cost
# (launch-readiness P0-05). `DoNotSchedule` makes the scheduler refuse instead,
# so an unspreadable Deployment is a visible Pending pod rather than an invisible
# loss of redundancy.
topologySpreadStrict: true

components:
  api:
    replicas: 3
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 2Gi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 24
      targetCPUUtilizationPercentage: 60
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: true
      minAvailable: 2

  web:
    replicas: 3
    resources:
      requests: { cpu: 300m, memory: 512Mi }
      limits: { memory: 1Gi }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 16
      targetCPUUtilizationPercentage: 65
    pdb:
      enabled: true
      minAvailable: 2

  # realtime and scheduler stay disabled here, as in values.yaml: neither was
  # ever a separate process (the API image ignored `--role`), and it now refuses
  # to start with one. The API serves /realtime itself and the BullMQ scheduler
  # queue already guarantees one execution per tick across every replica.
  # See values.yaml for the full reasoning and how to re-enable properly.
  realtime:
    enabled: false

  worker-media:
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "3", memory: 6Gi }
    scratchVolume:
      enabled: true
      sizeLimit: 60Gi
      mountPath: /scratch
    keda:
      enabled: true
      # One warm media worker: probe and proxy are on the critical path from
      # upload to editor, and a cold start there is visible to the user.
      minReplicaCount: 1
      maxReplicaCount: 24
    pdb:
      enabled: true
      maxUnavailable: 1

  worker-ai:
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "3", memory: 4Gi }
    keda:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 40
    pdb:
      enabled: true
      maxUnavailable: 1

  render:
    resources:
      requests: { cpu: "3", memory: 6Gi }
      limits: { cpu: "4", memory: 10Gi }
    scratchVolume:
      enabled: true
      sizeLimit: 120Gi
      mountPath: /scratch
    keda:
      enabled: true
      # Renders are bursty and expensive to keep warm; the export dialog already
      # shows an ETA, so zero is honest.
      minReplicaCount: 0
      maxReplicaCount: 24
    terminationGracePeriodSeconds: 900
    pdb:
      enabled: true
      maxUnavailable: 1

  scheduler:
    enabled: false
