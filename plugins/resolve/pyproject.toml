[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aksharo-resolve"
version = "0.1.0"
description = "DaVinci Resolve in-app Python script (Aksharo — works with DaVinci Resolve). Runs headless in CI against a fake Resolve host; only host/resolve.py touches the real DaVinciResolveScript module."
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
dependencies = [
  # Bridge client transport (C01 protocol §"Local bridge protocol (v2)").
  "websockets==15.0.1",
  # Device-code bootstrap (B08b) talks HTTP to the API.
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.5",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.167.1",
  "pip-tools==7.6.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aksharo_core_app*"]

[tool.setuptools.package-data]
aksharo_core_app = ["py.typed"]

# ---------------------------------------------------------------------------
# ruff — lint + format (mirrors apps/worker-ai)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF", "ANN", "ASYNC", "S",
]
ignore = [
  "ANN401", # `Any` is honest at the fake/real host boundary
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]
# The Resolve-installed entry file runs under Resolve's own interpreter, not this
# venv, and does path surgery before any first-party import exists.
"aksharo_core.py" = ["ANN", "S"]

[tool.ruff.lint.isort]
known-first-party = ["aksharo_core_app"]

# ---------------------------------------------------------------------------
# mypy — strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
exclude = ["^\\.venv/", "^build/", "^dist/"]
mypy_path = "."

[[tool.mypy.overrides]]
# DaVinciResolveScript ships no stubs and is only importable inside Resolve's own
# process; host/resolve.py wraps it behind the typed ResolveHost protocol.
module = ["DaVinciResolveScript.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=aksharo_core_app --cov-branch --cov-report=term-missing --cov-fail-under=75"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
  "slow: needs a real DaVinci Resolve install; skipped in CI (A00-04 spike pending)",
]

[tool.coverage.run]
branch = true
source = ["aksharo_core_app"]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  '\.\.\.',
]
