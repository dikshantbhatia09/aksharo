name: CI

on:
  push:
    branches: ["main", "wave/**", "wp/**"]
  pull_request:
    branches: ["main", "wave/**"]

# One run per ref: a new push cancels the previous run, except on main where
# every commit must be proven green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript: lint, typecheck, unit tests and build for every workspace package
  # ---------------------------------------------------------------------------
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # @montaj/api runs in its own job below, against Postgres and Redis service
      # containers; running it here as well would start testcontainers a second
      # time for the same suites (A23a).
      - name: Unit tests
        run: pnpm test --filter='!@montaj/worker-ai' --filter='!@montaj/model-server' --filter='!@montaj/api'

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Python AI worker: ruff, mypy --strict, pytest
  # ---------------------------------------------------------------------------
  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/worker-ai
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: apps/worker-ai/requirements-dev.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Ruff
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: mypy --strict
        run: python -m mypy --strict .

      - name: pytest
        run: python -m pytest -q

  # ---------------------------------------------------------------------------
  # API suite: one Postgres and one Redis as service containers.
  #
  # A23a: `apps/api/test/global-setup.ts` starts its own pair when it has to, but
  # a GitHub runner would then be running Docker inside a Docker-provisioned job
  # for no gain. `TEST_DATABASE_URL` and `TEST_REDIS_URL` point it at the services
  # below instead, so the whole suite runs with ZERO containers of its own: the
  # template database is built once on the Postgres service and each suite clones
  # it, taking a logical Redis database and a queue prefix of its own.
  #
  # The Redis service is this job's alone, so the run may hand out all sixteen of
  # its logical databases — one per e2e suite. `global-setup.ts` leaves database 0
  # alone when it can and takes it, loudly, when there are more suites than
  # databases above it.
  # ---------------------------------------------------------------------------
  api:
    name: API (Postgres + Redis services)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Must be pgvector, not stock postgres:16: the first migration creates a
        # `vector(512)` column and needs the extension to exist.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: montaj
          POSTGRES_PASSWORD: montaj
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U montaj -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://montaj:montaj@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `turbo run test` builds the workspace packages @montaj/api imports first.
      - name: API unit, integration and e2e tests
        run: pnpm test --filter=@montaj/api

      # The point of the two service containers above: testcontainers labels
      # everything it starts, so this is a hard gate on "the suite started none".
      - name: The suite started no containers of its own
        if: always()
        run: |
          count=$(docker ps --all --quiet --filter 'label=org.testcontainers=true' | wc -l)
          echo "testcontainers-managed containers: $count"
          test "$count" -eq 0

  # ---------------------------------------------------------------------------
  # GPU model server (A26): ruff, mypy --strict, pytest, and both halves of the
  # CONTRACTS section 9 coverage gate. No GPU: MODEL_SERVER_DEVICE=cpu throughout,
  # and the tests that need a real model download are behind RUN_SLOW=1.
  # ---------------------------------------------------------------------------
  model-server:
    name: Model server (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/model-server
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    env:
      MODEL_SERVER_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: apps/model-server/requirements-dev.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Ruff
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: mypy --strict
        run: python -m mypy --strict .

      - name: pytest
        run: python -m pytest -q

      # --cov-fail-under blends lines and branches into one number, so a run with
      # 95% of lines and 40% of branches passes it while failing CONTRACTS
      # section 9. This checks the two thresholds separately.
      - name: Coverage gate (75 lines / 70 branches)
        run: python scripts/coverage_gate.py

  # ---------------------------------------------------------------------------
  # The model-server image must keep building. CI builds the `cpu` target: the
  # CUDA target needs a 4 GB base image and a Hugging Face token for the gated
  # pyannote weights, which is a [H] step (infra/gpu/README.md), while the cpu
  # target proves the thing CI can actually prove - the lock resolves, the app
  # installs, and the container boots and serves.
  # ---------------------------------------------------------------------------
  model-server-image:
    name: Model server image (CPU target)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the CPU target
        run: |
          docker build \
            -f apps/model-server/Dockerfile \
            --target cpu \
            -t aksharo/model-server:ci \
            apps/model-server

      # MODEL_SERVER_PRELOAD is empty on purpose: nothing is loaded, so the smoke
      # needs no network and no weights, and it still proves the entry point, the
      # settings, auth, the error envelope and the metric names.
      - name: Boot the container and smoke the routes
        run: |
          docker run -d --name model-server-ci \
            -e GPU_PROVIDER_TOKEN=ci-smoke-token \
            -e MODEL_SERVER_PRELOAD= \
            aksharo/model-server:ci
          docker exec -i model-server-ci python - <<'SMOKE'
          import json, sys, time, urllib.error, urllib.request

          BASE = "http://127.0.0.1:8000"

          def call(path, *, token=None, body=None, tries=1):
              request = urllib.request.Request(BASE + path, method="POST" if body else "GET")
              if body is not None:
                  request.data = json.dumps(body).encode()
                  request.add_header("content-type", "application/json")
              if token:
                  request.add_header("authorization", "Bearer " + token)
              for attempt in range(tries):
                  try:
                      with urllib.request.urlopen(request, timeout=5) as response:
                          return response.status, response.read().decode()
                  except urllib.error.HTTPError as error:
                      return error.code, error.read().decode()
                  except OSError:
                      if attempt == tries - 1:
                          raise
                      time.sleep(1)
              raise SystemExit("unreachable")

          status, body = call("/healthz", tries=30)
          assert status == 200 and json.loads(body)["status"] == "ok", (status, body)

          status, body = call("/readyz")
          assert status == 200, (status, body)

          status, body = call("/transcribe", body={"audio": "x"})
          assert status == 401, (status, body)
          assert json.loads(body)["error"]["code"] == "model-server/unauthorized", body

          status, body = call("/transcribe", token="ci-smoke-token", body={"audio": "x"})
          assert status == 503, (status, body)
          assert json.loads(body)["error"]["code"] == "model-server/model-unavailable", body

          status, text = call("/metrics")
          series = {line.split("{")[0].split(" ")[0]
                    for line in text.splitlines() if line.startswith("model_server_")}
          assert len(series) >= 8, sorted(series)

          print("model-server image smoke passed;", len(series), "model_server_* series")
          sys.exit(0)
          SMOKE

      - name: Container logs
        if: always()
        run: docker logs model-server-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f model-server-ci || true

  # ---------------------------------------------------------------------------
  # Playwright smoke: chromium + webkit, the two lanes that gate every release
  # ---------------------------------------------------------------------------
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build --filter=@montaj/web...

      - name: Install browsers
        run: pnpm --filter @montaj/web exec playwright install --with-deps chromium webkit

      - name: Run smoke tests
        run: pnpm --filter @montaj/web test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The dev stack must stay valid: a broken compose file blocks every wave gate
  # ---------------------------------------------------------------------------
  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate with the example override applied
        run: |
          cp docker-compose.override.example.yml docker-compose.override.yml
          docker compose config --quiet

      - name: Every CONTRACTS section 1 variable is in .env.example
        run: |
          names=$(awk '/^## 1\. Environment variables/{f=1;next} /^## /{f=0} f' docs/CONTRACTS.md \
                  | grep -oE '`[A-Z][A-Z0-9_]+`' | tr -d '`' | sort -u)
          test -n "$names" || { echo "::error::could not read CONTRACTS section 1"; exit 1; }
          missing=0
          for name in $names; do
            if ! grep -qE "^${name}=" .env.example; then
              echo "::error file=.env.example::${name} is missing from .env.example"
              missing=1
            fi
          done
          exit $missing
